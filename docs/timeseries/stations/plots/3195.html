                        "&entry." + startEntry2Id + "=" + start + 
                        "&entry." + endEntry2Id + "=" + end +
                        "&entry." + startEntry3Id + "=" + start + 
                        "&entry." + endEntry3Id + "=" + end;

                    document.getElementById('form-container').innerHTML = 
                        '<iframe src="' + finalUrl + '" frameborder="0">Loading form…</iframe>';
                })();
